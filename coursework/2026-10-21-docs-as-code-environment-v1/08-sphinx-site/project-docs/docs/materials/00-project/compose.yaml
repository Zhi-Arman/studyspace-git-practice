# Local optional deployment candidate / 本地可选配置 / Необязательная локальная конфигурация
name: studyspace
services:
  backend:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////app/backend/data/studyspace.db
      CORS_ORIGINS: '["http://127.0.0.1:8080","http://localhost:8080"]'
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - studyspace-data:/app/backend/data
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  studyspace-data:
