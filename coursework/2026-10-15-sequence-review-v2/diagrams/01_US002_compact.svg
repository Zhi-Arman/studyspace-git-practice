<line x1="2050.0" y1="124" x2="2050.0" y2="1408" stroke="#A2ADB6" stroke-width="2" stroke-dasharray="11 9"/>
<line x1="32" y1="686" x2="2168" y2="686" stroke="#728392" stroke-width="2"/>
<line x1="32" y1="1386" x2="2168" y2="1386" stroke="#728392" stroke-width="2"/>
<line x1="32" y1="686" x2="32" y2="1386" stroke="#728392" stroke-width="2"/>
<line x1="2168" y1="686" x2="2168" y2="1386" stroke="#728392" stroke-width="2"/>
<rect x="25.0" y="12" width="250" height="112" fill="#EAF0F5" stroke="#728392" stroke-width="2"/>
<text x="150.0" y="35" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">«actor»</text>
<text x="150.0" y="68" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">学生</text>
<text x="150.0" y="100" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">Студент</text>
<rect x="658.3333333333334" y="12" width="250" height="112" fill="#EAF0F5" stroke="#728392" stroke-width="2"/>
<text x="783.3333333333334" y="35" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">CMP-001</text>
<text x="783.3333333333334" y="68" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">界面</text>
<text x="783.3333333333334" y="100" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">Интерфейс</text>
<rect x="1291.6666666666667" y="12" width="250" height="112" fill="#EAF0F5" stroke="#728392" stroke-width="2"/>
<text x="1416.6666666666667" y="35" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">CMP-006</text>
<text x="1416.6666666666667" y="68" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">预约事务</text>
<text x="1416.6666666666667" y="100" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">Бронирование</text>
<rect x="1925.0" y="12" width="250" height="112" fill="#EAF0F5" stroke="#728392" stroke-width="2"/>
<text x="2050.0" y="35" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">CMP-009</text>
<text x="2050.0" y="68" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">数据访问</text>
<text x="2050.0" y="100" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">Данные</text>
<text x="1100" y="162" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">一个目标 创建一条单座位预约；业务接口为拟定契约</text>
<text x="1100" y="193" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">Одна цель: создать одну бронь места; API проектируется</text>
<rect x="206.41666666666669" y="230.0" width="520.5" height="32.0" fill="white"/>
<text x="466.6666666666667" y="246" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">1  选择 seat_id、业务日 D、start/end</text>
<rect x="250.16666666666669" y="261.0" width="433.0" height="30.0" fill="white"/>
<text x="466.6666666666667" y="276" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">Выбрать место, дату и интервал</text>
<line x1="150.0" y1="296" x2="783.3333333333334" y2="296" stroke="#253F51" stroke-width="2" marker-end="url(#arr)"/>
<rect x="870.25" y="306.5" width="459.5" height="33.0" fill="white"/>
<text x="1100.0" y="323" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">2  POST /api/v1/bookings + 会话</text>
<rect x="924.75" y="338.25" width="350.5" height="29.5" fill="white"/>
<text x="1100.0" y="353" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">Передать заявку и сессию</text>
<line x1="783.3333333333334" y1="373" x2="1416.6666666666667" y2="373" stroke="#253F51" stroke-width="2" marker-end="url(#arr)"/>
<text x="1100" y="388" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">CMP-006 协调 CMP-002 校验会话；细节沿用详细版</text>
<text x="1100" y="419" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">CMP-006 проверяет сессию через CMP-002; детали в v1</text>
<rect x="1488.5833333333335" y="456.0" width="489.5" height="32.0" fill="white"/>
<text x="1733.3333333333335" y="472" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">3  开始 tx；加锁并读取当前决策数据</text>
<rect x="1384.8333333333335" y="487.0" width="697.0" height="30.0" fill="white"/>
<text x="1733.3333333333335" y="502" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">Начать tx, блокировать и прочитать текущие данные</text>
<line x1="1416.6666666666667" y1="522" x2="2050.0" y2="522" stroke="#253F51" stroke-width="2" marker-end="url(#arr)"/>
<rect x="1438.3333333333335" y="533.0" width="590.0" height="32.0" fill="white"/>
<text x="1733.3333333333335" y="549" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">4  返回 tx、锁后 now、资格规则与重叠数据</text>
<rect x="1268.5078125" y="564.0" width="906.0" height="30.0" fill="white"/>
<text x="1721.5078125" y="579" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">Вернуть tx, время после блокировок, данные допуска и пересечений</text>
<line x1="2050.0" y1="599" x2="1416.6666666666667" y2="599" stroke="#253F51" stroke-width="2" stroke-dasharray="11 9" marker-end="url(#arr)"/>
<text x="1100" y="614" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">同一 tx 内由 CMP-006 协调 CMP-003、004 完成业务校验</text>
<text x="1100" y="645" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">CMP-006 с CMP-003 и CMP-004 проверяет правила в той же tx</text>
<text x="48" y="705" font-size="26" text-anchor="start" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">alt</text>
<rect x="828.0" y="689.75" width="544.0" height="28.5" fill="white"/>
<text x="1100" y="704" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">[资格或时间规则失败，或学生／座位区间冲突]</text>
<rect x="660.0" y="720.0" width="880.0" height="30.0" fill="white"/>
<text x="1100" y="735" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">[Нет допуска, нарушены правила времени либо есть пересечение]</text>
<text x="1100" y="762" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">失败先回滚 tx；回滚内部交互见详细版</text>
<text x="1100" y="793" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">Сначала откатить tx; внутренние вызовы приведены в v1</text>
<rect x="907.25" y="830.25" width="385.5" height="31.5" fill="white"/>
<text x="1100.0" y="846" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">5a  403 / 422 / 409 + 原因码</text>
<rect x="907.25" y="861.25" width="385.5" height="29.5" fill="white"/>
<text x="1100.0" y="876" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">Вернуть отказ и код причины</text>
<line x1="1416.6666666666667" y1="896" x2="783.3333333333334" y2="896" stroke="#253F51" stroke-width="2" stroke-dasharray="11 9" marker-end="url(#arr)"/>
<rect x="242.66666666666669" y="907.0" width="448.0" height="32.0" fill="white"/>
<text x="466.6666666666667" y="923" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">6a  显示拒绝原因或建议重新选择</text>
<rect x="136.91666666666669" y="938.0" width="659.5" height="30.0" fill="white"/>
<text x="466.6666666666667" y="953" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">Показать причину либо предложить другой выбор</text>
<line x1="783.3333333333334" y1="973" x2="150.0" y2="973" stroke="#253F51" stroke-width="2" stroke-dasharray="11 9" marker-end="url(#arr)"/>
<line x1="32" y1="988" x2="2168" y2="988" stroke="#728392" stroke-width="2" stroke-dasharray="11 9"/>
<rect x="841.0" y="995.75" width="518.0" height="28.5" fill="white"/>
<text x="1100" y="1010" font-size="26" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">[资格与规则通过，且无学生／座位区间冲突]</text>
<rect x="777.0" y="1026.0" width="646.0" height="30.0" fill="white"/>
<text x="1100" y="1041" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">[Допуск и правила соблюдены, пересечений нет]</text>
<rect x="1446.5833333333335" y="1064.0" width="573.5" height="32.0" fill="white"/>
<text x="1733.3333333333335" y="1080" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">5b  持久化一条预约与最少事件，COMMIT</text>
<rect x="1354.8333333333335" y="1095.0" width="757.0" height="30.0" fill="white"/>
<text x="1733.3333333333335" y="1110" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">Сохранить одну бронь и минимальное событие, COMMIT</text>
<line x1="1416.6666666666667" y1="1130" x2="2050.0" y2="1130" stroke="#253F51" stroke-width="2" marker-end="url(#arr)"/>
<rect x="1547.5833333333335" y="1140.5" width="371.5" height="33.0" fill="white"/>
<text x="1733.3333333333335" y="1157" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">6b  提交成功 + booking_id</text>
<rect x="1486.0833333333335" y="1172.25" width="494.5" height="29.5" fill="white"/>
<text x="1733.3333333333335" y="1187" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">Вернуть успех фиксации и booking_id</text>
<line x1="2050.0" y1="1207" x2="1416.6666666666667" y2="1207" stroke="#253F51" stroke-width="2" stroke-dasharray="11 9" marker-end="url(#arr)"/>
<rect x="757.0" y="1217.75" width="686.0" height="32.5" fill="white"/>
<text x="1100.0" y="1234" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">7b  201 Created + booking_id、seat、start/end</text>
<rect x="921.75" y="1249.25" width="356.5" height="29.5" fill="white"/>
<text x="1100.0" y="1264" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">Вернуть созданную запись</text>
<line x1="1416.6666666666667" y1="1284" x2="783.3333333333334" y2="1284" stroke="#253F51" stroke-width="2" stroke-dasharray="11 9" marker-end="url(#arr)"/>
<rect x="347.6666666666667" y="1295.0" width="238.0" height="32.0" fill="white"/>
<text x="466.6666666666667" y="1311" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">8b  显示预约确认</text>
<rect x="298.4166666666667" y="1326.25" width="336.5" height="29.5" fill="white"/>
<text x="466.6666666666667" y="1341" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#152431" font-family="Arial,Heiti SC,sans-serif">Показать подтверждение</text>
<line x1="783.3333333333334" y1="1361" x2="150.0" y2="1361" stroke="#253F51" stroke-width="2" stroke-dasharray="11 9" marker-end="url(#arr)"/>
</svg>