[project]
name = "studyspace-backend"
version = "0.4.0"
description = "StudySpace local course reservation application"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0,<2.1",
    "pydantic-settings>=2.7,<3.0",
    "alembic>=1.15,<2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4.0"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.9,<1.0",
    "openapi-spec-validator>=0.7,<0.8",
    "httpx2>=2.16.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Historical Word generators embed bilingual source paragraphs; wrapping them changes content.
[tool.ruff.lint.per-file-ignores]
"**/scripts/build_backlog_packet.py" = ["E501"]
"**/scripts/build_invest_document.py" = ["E501"]
"**/scripts/build_two_adrs.py" = ["E501"]
"**/scripts/build_component_candidates.py" = ["E501"]
"**/scripts/reorder_backlog_packet.py" = ["E501"]
"**/scripts/format_invest_document.py" = ["E501"]
